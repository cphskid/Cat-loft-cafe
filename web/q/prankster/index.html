<style>
:root{--wood-d:#5D4037;--wood-l:#C9A27E;--ink:#4A3428;--muted:#8B776B;--line:#E6DACB;--accent:#D9773E;--accent-d:#B85F2C;
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;--body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:var(--body);line-height:1.6;-webkit-text-size-adjust:100%;
  background:radial-gradient(ellipse at 15% 0%,#FBF3E4 0,rgba(251,243,228,0) 55%),radial-gradient(ellipse at 90% 40%,#EFE2CF 0,rgba(239,226,207,0) 50%),#F5EEE4;min-height:100vh}
.bar{position:sticky;top:0;z-index:5;background:rgba(253,251,247,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar div{width:min(460px,100% - 32px);margin:0 auto;height:52px;display:flex;align-items:center;justify-content:space-between}
.logo{font-family:var(--display);font-weight:700;font-size:19px;color:var(--wood-d);text-decoration:none;letter-spacing:.06em}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:11px 26px;font:700 17px var(--display);text-decoration:none;border:2px solid transparent;cursor:pointer}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(217,119,62,.3)}.btn.primary:hover{background:var(--accent-d)}
.btn.ghost{border-color:var(--wood-l);color:var(--wood-d);background:rgba(255,255,255,.7)}
.btn.sm{padding:6px 16px;font-size:14px;box-shadow:none}
main{width:min(460px,100% - 32px);margin:0 auto;padding:18px 0 40px}
.panel{background:#FDFBF7;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(93,64,55,.08)}
.intro{text-align:center}
.intro .cats{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:96px;margin:4px 0 6px}.intro .cats img{height:84px;max-width:24%;object-fit:contain}
.intro h1{font-family:var(--display);color:var(--wood-d);font-size:30px;margin:4px 0}
.intro p{color:var(--muted);margin:6px 0 16px}
.invite{background:#FFF4E2;border:1.5px solid #F0C995;border-radius:14px;padding:10px 14px;margin:0 0 14px;font-size:15px;color:var(--wood-d);text-align:center}
.invite b{font-family:var(--display);font-size:18px}
.shared canvas{width:100%;aspect-ratio:4/5;border-radius:14px;display:block;box-shadow:0 6px 18px rgba(93,64,55,.2);background:#FBF4E8}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}
</style>

<body data-type="prankster">
<header class="bar"><div><a class="logo" href="../../about/">暖陽貓閣</a><a class="btn primary sm" href="../../">立即試玩</a></div></header>
<main>
  <div id="invite" class="invite" hidden></div>
  <div class="panel" id="box"></div>
  <p class="foot">暖陽貓閣是一款手繪水彩風的貓咪咖啡廳經營遊戲，免費、免下載，手機和電腦的瀏覽器都能玩。</p>
</main>
<script src="../../quiz.js"></script>
<script>
(function () {
  const UP = '../../', SB_URL = 'https://bxrppdsbhuhjluprohkf.supabase.co', SB_KEY = 'sb_publishable_a99TJ4CiEW14ToPcoyn4KQ_NdoqXg2A';
  const qs = new URLSearchParams(location.search), ref = (qs.get('r') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
  const shared = CATQ.typeOf(document.body.dataset.type), box = document.getElementById('box');
  // the friend's code rides along into the game, so their invite counts when this player opens a shop
  if (ref.length === 6) try { localStorage.setItem('catloft-ref', ref); } catch {}
  let inviter = '';
  const toast = m => { const t = document.createElement('div'); t.textContent = m; t.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(74,52,40,.92);color:#fff;padding:9px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:90%'; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); };
  // a player of the game on this device shares with their own friend code (saved by the game)
  const myCode = () => { try { const c = localStorage.getItem('catloft-mycode') || ''; return /^[A-Z0-9]{6}$/.test(c) && c !== ref ? c : ''; } catch { return ''; } };
  const game = t => UP + '?quiz=' + t.id + (ref.length === 6 ? '&r=' + ref : '');
  function quiz() {
    CATQ.mount(box, { toast, code: myCode, extra: t => [{ label: `進遊戲領本命貓「${t.cat}」🐾`, cls: 'go', href: game(t) }],
      note: t => `本命貓「${t.cat}」是一隻${CATQ.persName(t)}的貓，不用登入就能領：按上面的按鈕進遊戲，開店後牠就會來店裡。` }).ask();
    scrollTo(0, 0);
  }
  async function intro() {
    if (shared) {
      box.innerHTML = `<div class="shared"><canvas width="1080" height="1350"></canvas></div>
        <div class="row"><button class="btn primary" id="go">我也要測</button><a class="btn ghost" href="${UP}">直接去玩</a></div>`;
      document.getElementById('go').onclick = quiz;
      const cv = await CATQ.card(shared, ref.length === 6 ? ref : '', inviter);
      box.querySelector('canvas').getContext('2d').drawImage(cv, 0, 0);
    } else {
      box.innerHTML = `<div class="intro"><div class="cats">${['orange_2', 'calico_3', 'gray_1', 'tux_1'].map(c => `<img src="${UP}assets/cat_${c}.webp" alt="">`).join('')}</div>
        <h1>測測你是哪一種喵？</h1><p>8 題、1 分鐘，不用登入。<br>測完可以把你的喵型圖卡分享給朋友，<br>還能到遊戲裡領一隻跟你同個性的本命貓。</p>
        <button class="btn primary" id="go">開始測驗</button></div>`;
      document.getElementById('go').onclick = quiz;
    }
  }
  async function who() {
    if (ref.length !== 6) return;
    try {
      const r = await fetch(SB_URL + '/rest/v1/rpc/catloft_invite_who', { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_code: ref }) });
      const name = r.ok ? await r.json() : null;
      if (typeof name === 'string' && name) {
        inviter = name.replace(/[<>&"'`\\]/g, '').slice(0, 12);
        const el = document.getElementById('invite'); el.hidden = false;
        el.innerHTML = `<b>「${inviter}」</b>邀請你來暖陽貓閣！<br>從這個連結開新店，你們會自動變成好友，還能拿到限定的太陽貓掌髮夾。`;
      }
    } catch {}
  }
  intro();
  // redraw a shared card with the inviting shop's name once we know it
  who().then(async () => { const c = box.querySelector('.shared canvas'); if (shared && inviter && c) c.getContext('2d').drawImage(await CATQ.card(shared, ref, inviter), 0, 0); });
})();
</script>
</body>
