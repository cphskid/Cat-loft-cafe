<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>暖陽貓閣｜管理者</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* 管理者頁面：用管理者的遊戲帳號（chency0311、chuck）登入，看所有玩家、問題回報，送玩家錢（不限金額）、店長衣服或訊息，看玩家的遊戲進度。
   密碼不在這個檔案裡：這裡只把輸入的密碼送去 Supabase 登入「管理者」這個帳號，
   能不能讀資料是資料庫那邊判斷的（supabase/catloft_admin.sql 的 catloft_is_admin）。 */
:root{
  --wood:#8D6E63; --wood-d:#5D4037; --wood-l:#C9A27E;
  --paper:#FDFBF7; --white:#FFFFFF; --ink:#4A3428; --muted:#8B776B; --line:#E6DACB;
  --sun:#F6E7C8; --accent:#D9773E; --good:#6E9B4E; --bad:#C65445;
  --display:"LXGW WenKai TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#F2EBE1;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{width:min(1100px,100% - 32px);margin:0 auto;padding:20px 0 60px}
h1,h2{font-family:var(--display);color:var(--wood-d);margin:0}
h1{font-size:24px}
button,input,select{font-family:inherit;font-size:14px}
button{border:1px solid var(--wood-l);background:var(--white);color:var(--wood-d);border-radius:10px;padding:7px 13px;cursor:pointer}
button.primary{background:var(--wood);border-color:var(--wood);color:#fff;font-weight:700}
button:disabled{opacity:.5;cursor:default}
input,select{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--white);color:var(--ink);min-width:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top .sp{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button.on{background:var(--sun);border-color:var(--wood-l);font-weight:700}
#login{max-width:360px;margin:12vh auto 0;text-align:center}
#login input{width:100%;margin:12px 0}
.tbl{width:100%;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--paper)}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.fb{border-bottom:1px solid var(--line);padding:10px 0}
.fb:last-child{border-bottom:0}
.fb .msg{white-space:pre-wrap;margin:4px 0}
.ans{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;margin-top:8px}
.ans textarea{flex:1 1 260px;min-height:38px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px;resize:vertical}
.tag{display:inline-block;border-radius:8px;padding:0 7px;font-size:12px;background:var(--sun);color:var(--wood-d);margin-right:6px}
.kpi{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}.kpi div{flex:1 1 140px;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:10px}.kpi b{display:block;font-size:22px}
.bar{height:10px;border-radius:5px;background:var(--accent);min-width:2px}.bar.b2{background:var(--good)}
h3{margin:18px 0 6px;font-size:16px}
.tag.bug{background:#F6D9D3;color:var(--bad)}.tag.idea{background:#DDEBD2;color:#4E7436}
.ov{position:fixed;inset:0;background:rgba(46,34,27,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov .card{width:min(440px,100%);max-height:90vh;overflow:auto}
.fld{display:block;margin:10px 0 0;font-size:14px;color:var(--muted)}
.fld input,.fld select{display:block;width:100%;margin-top:3px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:0 12px}
.checks{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}.checks label{display:flex;align-items:center;gap:5px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--wood-d);color:#fff;border-radius:10px;padding:8px 14px;z-index:9}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="login">
    <h1>🐾 管理者登入</h1>
    <p class="muted">用管理者的遊戲帳號登入</p>
    <form id="loginForm"><input id="user" autocomplete="username" placeholder="帳號名稱" style="margin-bottom:0">
    <input id="pw" type="password" autocomplete="current-password" placeholder="密碼">
    <button class="primary" style="width:100%">登入</button></form>
    <p class="muted" style="margin-top:14px"><a href="../" style="color:inherit">回到遊戲</a></p>
  </div>

  <div id="main" hidden>
    <div class="top"><h1>🐾 暖陽貓閣 管理者</h1><span class="sp"></span><button id="reload">重新整理</button><button id="logout">登出</button></div>
    <div class="tabs"><button data-tab="players" class="on">玩家</button><button data-tab="news">📢 公告</button><button data-tab="fb">問題回報</button><button data-tab="stats">📈 統計</button><button data-tab="gifts">送過的東西</button><button data-tab="me">🛠️ 調整我的店</button></div>
    <div class="card" id="tab-players">
      <div class="top" style="margin-bottom:8px"><input id="q" placeholder="搜尋帳號、店名、好友碼" style="flex:1;max-width:320px"><span class="muted" id="pCount"></span></div>
      <div class="tbl"><table><thead><tr><th>帳號</th><th>店名</th><th>店長</th><th>天數</th><th>Lv</th><th>現金</th><th>欠款</th><th>粉絲</th><th>累計營收</th><th>貓</th><th>分店</th><th>好友碼</th><th title="從 2026/10/31 開始算，只算畫面開著、兩分鐘內有操作的時間">總遊玩時間</th><th title="從 2026/10/31 開始算">來過幾天</th><th>最後遊玩</th><th></th></tr></thead><tbody id="pBody"></tbody></table></div>
    </div>
    <div class="card" id="tab-news" hidden>
      <p class="muted" style="margin:0 0 6px">打字發布，玩家的手機「公告」App 馬上看得到，開著遊戲的玩家一分鐘內會跳出公告卡片。時間到會自動消失。</p>
      <label class="fld">標題（最多 30 字）<input id="nTitle" maxlength="30" placeholder="例如：聖誕節活動開始囉！"></label>
      <label class="fld">內容（最多 300 字，可以不填）<textarea id="nBody" maxlength="300" rows="4" style="display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px" placeholder="例如：完成活動任務拿代幣，換限定聖誕衣服和飾品！"></textarea></label>
      <label class="fld" style="max-width:200px">幾天後自動消失<select id="nDays"><option value="1">1 天</option><option value="3">3 天</option><option value="7" selected>7 天</option><option value="14">14 天</option><option value="30">30 天</option></select></label>
      <div class="row" style="justify-content:flex-start"><button class="primary" id="nGo">📢 發布公告</button></div>
      <h3>最近的公告</h3><div id="nList"><p class="muted">讀取中…</p></div>
    </div>
    <div class="card" id="tab-fb" hidden><div id="fbList"></div></div>
    <div class="card" id="tab-me" hidden>
      <p style="margin:0 0 6px">帳號 <b id="meWho"></b> 現在：<span class="muted" id="meNow"></span></p>
      <p class="muted" style="margin:0 0 6px">只填想改的，留空就不改。遊戲開著的話一分鐘內會改好，傢俱、桌子和擴建要隔天開店才會擺出來。</p>
      <div class="grid">
        <label class="fld">現金（¥）<input id="mCash" type="number" min="0"></label>
        <label class="fld">欠款（¥）<input id="mDebt" type="number" min="0"></label>
        <label class="fld">粉絲<input id="mFans" type="number" min="0"></label>
        <label class="fld">天數<input id="mDay" type="number" min="1"></label>
        <label class="fld">累計營收（¥，到 100,000 可以開分店）<input id="mEarned" type="number" min="0"></label>
        <label class="fld">店鋪等級（1–7）<input id="mLv" type="number" min="1" max="7"></label>
        <label class="fld">所有食材都設成幾份<input id="mStock" type="number" min="0"></label>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="mOutfits"> 所有衣服</label>
        <label><input type="checkbox" id="mCharms"> 所有飾品</label>
        <label><input type="checkbox" id="mFurn"> 所有傢俱</label>
        <label><input type="checkbox" id="mExpand"> 擴建全部完成</label>
        <label><input type="checkbox" id="mTables"> 桌子加到最多</label>
      </div>
      <div class="row"><button class="primary" id="mGo">套用</button></div>
    </div>
    <div class="card" id="tab-stats" hidden><div id="statsBody"><p class="muted">讀取中…</p></div></div>
    <div class="card" id="tab-gifts" hidden><div class="tbl"><table><thead><tr><th>送出時間</th><th>給誰</th><th>送了什麼</th><th>留言／訊息</th><th>玩家收了嗎</th></tr></thead><tbody id="gBody"></tbody></table></div></div>
  </div>
</div>

<div class="ov" id="giftOv" hidden><div class="card">
  <h2>🎁 送給 <span id="giftWho"></span></h2>
  <p class="muted" style="margin:4px 0 0">玩家下次開遊戲（或一分鐘內）會跳出來。錢和衣服玩家可以選「收下」或「不要」。</p>
  <div class="tabs" id="gKind" style="margin:12px 0 0"><button data-k="cash" class="on">💰 錢</button><button data-k="outfit">👗 衣服</button><button data-k="msg">💌 訊息</button></div>
  <label class="fld" id="gCashF">金額（¥，不限）<input id="gCash" type="number" min="1" step="1" inputmode="numeric" placeholder="例如 10000"></label>
  <label class="fld" id="gOutfitF" hidden>店長衣服<select id="gOutfit"></select></label>
  <label class="fld"><span id="gNoteL">留言（最多 60 字，玩家會看到）</span><textarea id="gNote" maxlength="60" rows="2" style="display:block;width:100%;margin-top:3px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:14px" placeholder="例如：謝謝你回報問題！"></textarea></label>
  <div class="row"><button id="gCancel">取消</button><button class="primary" id="gSend">送出</button></div>
</div></div>
<div class="ov" id="progOv" hidden><div class="card" style="width:min(560px,100%)">
  <h2>📊 <span id="progWho"></span> 的進度</h2>
  <div id="progBody" style="margin-top:8px"><p class="muted">讀取中…</p></div>
  <div class="row"><button id="progGift">🎁 送東西／傳訊息</button><button class="primary" id="progClose">關閉</button></div>
</div></div>
<div id="toast" hidden></div>

<script>
const SB_URL = 'https://bxrppdsbhuhjluprohkf.supabase.co', SB_KEY = 'sb_publishable_a99TJ4CiEW14ToPcoyn4KQ_NdoqXg2A';
// 遊戲帳號名稱轉成 Supabase 的 email，跟 ../index.html 的 acctEmail 一樣；誰是管理者由資料庫的 catloft_is_admin 判斷
const acctEmail = name => 'u' + [...new TextEncoder().encode(name.trim().toLowerCase())].map(b => b.toString(16).padStart(2, '0')).join('') + '@catloft.player';
// 店長衣服，跟 ../index.html 的 OUTFITS 一樣（id 要對得上；遊戲找不到的 id 會自動當成「不要」）
const OUTFITS = [['basic', '咖啡廳圍裙'], ['mo1', '貓咪毛衣'], ['mo7', '貓耳連帽衫'], ['mo2', '草莓洋裝／草莓襯衫'], ['mo8', '格紋背心裙／格紋背心'], ['mo6', '草帽洋裝／草帽亞麻衫'],
  ['mo3', '夏日浴衣'], ['mo9', '咖啡師圍裙'], ['mo4', '甜點師白袍'], ['mo5', '聖誕毛衣'], ['mo10', '萬聖節小魔女／小巫師']];
const outfitName = id => (OUTFITS.find(o => o[0] === id) || [id, id])[1];
const LV_EXP = [0, 40, 110, 210, 340, 500, 700], lvOf = exp => LV_EXP.filter(e => (exp || 0) >= e).length;
const ROLE = { cook: '煮飯', server: '上收餐', cashier: '櫃檯', feeder: '餵食', sitter: '逗貓', server2: '庭院送餐' };
const SHOP = { 1: '暖陽貓閣', 2: '貓咪庭院' };
const STAFF_NAME = { 1: { cook: '阿杰', server: '小美', cashier: '阿哲', feeder: '小芸', sitter: '阿凱' }, 2: { cook: '阿翔', server: '小葵', cashier: '阿德', feeder: '小綠', sitter: '阿樂', server2: '小柔' } }; // 沒面試過的員工用遊戲預設的名字
const KIND = { bug: '壞掉了', confusing: '看不懂', idea: '點子' };
// 處理狀態，跟樂園老師後台同一組代碼；括號裡是玩家在「我的回報」看到的字（../feedback.js 的 MY_STATUS）
const STATUS = { new: '新回報（已收到）', bug: '確認是問題（處理中）', unclear: '討論中（處理中）', request: '好點子', fixed: '修好了', dup: '重複回報（已處理）', wontfix: '先不改（看過了）' };

const $ = id => document.getElementById(id);
const sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: 'catloft-admin-auth', persistSession: true, autoRefreshToken: true } });
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const yen = n => n == null ? '' : '¥' + Math.round(n).toLocaleString();
const num = n => n == null ? '' : Math.round(n).toLocaleString();
// 遊玩秒數 → 「3 小時 25 分」；舊存檔沒有這個欄位時空白
const playTime = s => s == null ? '' : s < 60 ? '不到 1 分' : (s >= 3600 ? Math.floor(s / 3600) + ' 小時 ' : '') + Math.floor(s % 3600 / 60) + ' 分';
const when = t => t ? new Date(t).toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
const who = p => p ? (p.account || `（訪客）${p.shop_name || ''}`) : '？';
let toastT; function toast(m) { const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }
const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; };

let players = [], giftTo = null, selfId = null, days = [], daysBy = {};

$('loginForm').onsubmit = async e => {
  e.preventDefault();
  const b = e.submitter || $('loginForm').querySelector('button'); b.disabled = true;
  const name = $('user').value.trim();
  if (!name || !$('pw').value) { b.disabled = false; return toast('請輸入帳號名稱和密碼'); }
  const { error } = await sb.auth.signInWithPassword({ email: acctEmail(name), password: $('pw').value });
  b.disabled = false; $('pw').value = '';
  if (error) return toast('帳號名稱或密碼不對');
  start();
};
$('logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('reload').onclick = () => loadAll();
document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
  document.querySelectorAll('[data-tab]').forEach(x => x.classList.toggle('on', x === b));
  for (const t of ['players', 'news', 'fb', 'stats', 'gifts', 'me']) $('tab-' + t).hidden = t !== b.dataset.tab;
});
$('q').oninput = renderPlayers;

async function start() {
  let ok = false; try { ok = await rpc('catloft_is_admin'); } catch {}
  if (!ok) { await sb.auth.signOut(); $('login').hidden = false; $('main').hidden = true; return toast('這個帳號不是管理者'); }
  $('login').hidden = true; $('main').hidden = false;
  loadAll();
}
async function loadAll() {
  try {
    const [p, f, g, me, d] = await Promise.all([rpc('catloft_admin_players'), rpc('catloft_admin_feedback'), rpc('catloft_admin_gifts'), rpc('catloft_admin_self'),
      rpc('catloft_admin_play_days', { p_from: dayAdd(twToday(), -89) }).catch(() => [])]);
    players = p || []; selfId = me; days = d || []; daysBy = {};
    for (const r of days) (daysBy[r.user_id] = daysBy[r.user_id] || []).push(r);
    renderPlayers(); renderStats(); renderFb(f || []); renderGifts(g || []); renderMe(); loadNews();
  } catch (e) { toast('讀取失敗：' + (e.message || e)); }
}
// 📢 公告（../news.js 在遊戲裡顯示，supabase/catloft_news.sql）
async function loadNews() {
  let list; try { list = await rpc('catloft_admin_news_list') || []; } catch (e) { $('nList').innerHTML = `<p style="color:var(--bad)">讀不到：${esc(e.message || e)}</p>`; return; }
  const now = Date.now();
  $('nList').innerHTML = list.map(n => {
    const live = !n.deleted_at && new Date(n.expires_at) > now;
    const st = n.deleted_at ? '已下架' : live ? `顯示中，${when(n.expires_at)} 消失` : '已過期';
    return `<div class="fb"><div><span class="tag${live ? '' : ' bug'}">${st}</span><b>${esc(n.title)}</b></div>${n.body ? `<div class="msg">${esc(n.body)}</div>` : ''}
      <div class="muted" style="font-size:13px">${esc(n.who || '管理者')}・${when(n.created_at)} 發布${live ? ` <button data-ndel="${n.id}" style="margin-left:8px">提早下架</button>` : ''}</div></div>`;
  }).join('') || '<p class="muted">還沒有公告</p>';
  $('nList').querySelectorAll('[data-ndel]').forEach(b => b.onclick = async () => {
    if (!confirm('確定要把這則公告下架嗎？玩家就看不到了。')) return;
    try { await rpc('catloft_admin_news_delete', { p_id: +b.dataset.ndel }); toast('下架了'); loadNews(); } catch (e) { toast('下架失敗：' + (e.message || e)); }
  });
}
$('nGo').onclick = async () => {
  const title = $('nTitle').value.trim(); if (!title) return toast('請輸入標題');
  $('nGo').disabled = true;
  try {
    await rpc('catloft_admin_news_add', { p_title: title, p_body: $('nBody').value, p_days: +$('nDays').value });
    $('nTitle').value = ''; $('nBody').value = ''; toast('發布了！玩家馬上看得到'); loadNews();
  } catch (e) { toast('發布失敗：' + (e.message || e)); }
  $('nGo').disabled = false;
};
function renderPlayers() {
  const q = $('q').value.trim().toLowerCase();
  const list = players.filter(p => !q || [p.account, p.shop_name, p.mgr_name, p.friend_code].some(v => v && String(v).toLowerCase().includes(q)));
  $('pCount').textContent = `共 ${players.length} 位玩家` + (q ? `，符合 ${list.length} 位` : '');
  $('pBody').innerHTML = list.map(p => `<tr><td>${p.account ? esc(p.account) : '<span class="muted">訪客</span>'}</td><td>${esc(p.shop_name)}</td><td>${esc(p.mgr_name)}</td>
    <td class="n">${num(p.day)}</td><td class="n">${num(p.lv)}</td><td class="n">${yen(p.cash)}</td><td class="n">${p.debt ? yen(p.debt) : ''}</td><td class="n">${num(p.fans)}</td>
    <td class="n">${yen(p.earned)}</td><td class="n">${num(p.cats)}</td><td class="n">${num(p.shops)}</td><td>${esc(p.friend_code)}</td><td class="n">${playTime(p.play)}</td><td class="n">${(daysBy[p.user_id] || []).length || ''}</td><td>${when(p.updated_at)}</td>
    <td><button data-prog="${p.user_id}">📊 進度</button> <button data-gift="${p.user_id}">🎁 送東西</button></td></tr>`).join('') || '<tr><td colspan="16" class="muted">沒有玩家</td></tr>';
  $('pBody').querySelectorAll('[data-gift]').forEach(b => b.onclick = () => openGift(players.find(p => p.user_id === b.dataset.gift)));
  $('pBody').querySelectorAll('[data-prog]').forEach(b => b.onclick = () => openProg(players.find(p => p.user_id === b.dataset.prog)));
}
function renderFb(list) {
  const byId = Object.fromEntries(players.map(p => [p.user_id, p]));
  $('fbList').innerHTML = list.map(f => {

// ---- 📈 統計（catloft_play_days，supabase/catloft_stats.sql；2026-10-31 起才有資料）----
const twToday = () => new Date(Date.now() + 8 * 3600e3).toISOString().slice(0, 10);
const dayAdd = (d, n) => new Date(Date.parse(d + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10);
const twDay = t => new Date(Date.parse(t) + 8 * 3600e3).toISOString().slice(0, 10);
const md = d => +d.slice(5, 7) + '/' + +d.slice(8, 10);
const mins = s => Math.round((s || 0) / 60).toLocaleString() + ' 分';
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '';
const STATS_FROM = '2026-10-31';
// 遊戲送來的活動代號 → 看得懂的名字（web/stats.js 的 what()）
const APP_NAME = { home: '主畫面', menu: '掌上菜單', shop: '商店', hire: '喵才獵人', outing: '出去玩', wallet: '喵錢包', music: '喵音樂', myshop: '我的店', map: '分店地圖', promo: '喵喵宣傳',
  ig: '喵IG', badge: '徽章', game: '小遊戲', phone: '電話', cats: '喵喵家族', guests: '客人圖鑑', closet: '衣櫃', save: '存檔碼', settings: '設定', rank: '排行榜', friend: '好友', quiz: '喵型測驗', sign: '每日簽到' };
const FLOOR_NAME = { 1: { 1: '1F', 2: '2F 貓閣', 3: '休息室' }, 2: { 1: '1F 庭院', 2: '2F', 3: '休息室', 4: '3F 菜園' }, 3: { 1: '1F', 2: '2F 玩具', 5: '3F', 6: '4F', 3: '5F 休息區' } };
function actName(k) {
  const fixed = { cook: '廚房做正餐', dessert: '做甜點', reg: '收銀找錢', out: '出門走走', close: '打烊收尾・結算', prep: '開店前準備' };
  if (fixed[k]) return fixed[k];
  if (k.startsWith('app_')) return '手機：' + (APP_NAME[k.slice(4)] || k.slice(4));
  const m = k.match(/^s(\d)f(\d)$/);
  if (m) return '在店裡：' + (SHOP[m[1]] || '分店 ' + m[1]) + ' ' + ((FLOOR_NAME[m[1]] || {})[m[2]] || m[2] + 'F');
  return k;
}
function renderStats() {
  const today = twToday(), byDay = {}, born = {}, total = {};
  for (const r of days) { (byDay[r.d] = byDay[r.d] || []).push(r); total[r.user_id] = (total[r.user_id] || 0) + +r.secs; }
  for (const p of players) born[p.user_id] = twDay(p.created_at);
  if (!days.length) { $('statsBody').innerHTML = '<p class="muted">還沒有資料。玩家打開新版遊戲玩一分鐘後就會開始有紀錄（2026/10/31 起）。</p>'; return; }
  // 上面的數字
  const last7 = days.filter(r => r.d > dayAdd(today, -7)), who7 = new Set(last7.map(r => r.user_id));
  const sec7 = last7.reduce((a, r) => a + +r.secs, 0);
  const kpi = `<div class="kpi"><div>今天來玩<b>${(byDay[today] || []).length} 人</b></div><div>近 7 天來玩<b>${who7.size} 人</b></div>
    <div>近 7 天平均每人每天<b>${last7.length ? mins(sec7 / last7.length) : '—'}</b></div><div>近 7 天來 2 天以上<b>${[...who7].filter(u => new Set(last7.filter(r => r.user_id === u).map(r => r.d)).size >= 2).length} 人</b></div></div>`;
  // 每天
  const rows = [];
  for (let d = today; d >= STATS_FROM && rows.length < 30; d = dayAdd(d, -1)) {
    const l = byDay[d] || [], sec = l.reduce((a, r) => a + +r.secs, 0), nw = l.filter(r => born[r.user_id] === d).length;
    rows.push(`<tr><td>${md(d)}</td><td class="n">${l.length}</td><td class="n">${nw || ''}</td><td class="n">${l.length - nw || ''}</td><td class="n">${mins(sec)}</td><td class="n">${l.length ? mins(sec / l.length) : ''}</td></tr>`);
  }
  const daily = `<h3>每天</h3><div class="tbl"><table><thead><tr><th>日期</th><th>來玩人數</th><th>新玩家</th><th>老玩家</th><th>總共玩了</th><th>平均每人</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
  // 回流：某天加入的新玩家，隔天／7 天內有沒有回來
  const played = new Set(days.map(r => r.user_id + r.d)), coh = {};
  for (const p of players) { const b = born[p.user_id]; if (b >= STATS_FROM && b <= today) (coh[b] = coh[b] || []).push(p.user_id); }
  const back = (ids, b, n) => ids.filter(u => { for (let i = 1; i <= n; i++) if (played.has(u + dayAdd(b, i))) return true; return false; }).length;
  const cohRows = Object.keys(coh).sort().reverse().map(b => { const ids = coh[b], d1 = dayAdd(b, 1) <= today, d7 = dayAdd(b, 7) <= today;
    return `<tr><td>${md(b)}</td><td class="n">${ids.length}</td><td class="n">${d1 ? `${back(ids, b, 1)}（${pct(back(ids, b, 1), ids.length)}）` : '<span class="muted">還沒到</span>'}</td>
      <td class="n">${dayAdd(b, 1) <= today ? `${back(ids, b, 7)}（${pct(back(ids, b, 7), ids.length)}）${d7 ? '' : '<span class="muted"> 還在算</span>'}` : '<span class="muted">還沒到</span>'}</td></tr>`; }).join('');
  const ret = `<h3>新玩家有沒有回來</h3><p class="muted" style="margin:0 0 6px">某天開始玩的新玩家裡，隔天又來玩、7 天內又來玩的有幾位。</p>
    <div class="tbl"><table><thead><tr><th>開始玩的日期</th><th>新玩家</th><th>隔天回來</th><th>7 天內回來</th></tr></thead><tbody>${cohRows || '<tr><td colspan="4" class="muted">還沒有新玩家</td></tr>'}</tbody></table></div>`;
  // 時間花在哪裡：全部玩家 vs 玩得最久的 1/4
  const ranked = Object.keys(total).sort((a, b) => total[b] - total[a]), heavy = new Set(ranked.slice(0, Math.max(1, Math.ceil(ranked.length / 4))));
  const actAll = {}, actHeavy = {};
  for (const r of days) for (const [k, v] of Object.entries(r.act || {})) { actAll[k] = (actAll[k] || 0) + +v; if (heavy.has(r.user_id)) actHeavy[k] = (actHeavy[k] || 0) + +v; }
  // 店裡各樓層合成一行「在店裡走動・招呼客人」，細的放在下面

  const sumA = Object.values(gAll).reduce((a, v) => a + v, 0) || 1, sumH = Object.values(gHeavy).reduce((a, v) => a + v, 0) || 1;
  const nm = k => k === 'shop' ? '在店裡走動・招呼客人・摸貓' : actName(k);
  const actRows = Object.keys(gAll).sort((a, b) => gAll[b] - gAll[a]).map(k => `<tr><td>${esc(nm(k))}</td>
    <td style="min-width:120px"><div class="bar" style="width:${gAll[k] / sumA * 100}%"></div></td><td class="n">${pct(gAll[k], sumA)}</td>
    <td style="min-width:120px"><div class="bar b2" style="width:${(gHeavy[k] || 0) / sumH * 100}%"></div></td><td class="n">${pct(gHeavy[k] || 0, sumH)}</td></tr>`).join('');
  const floorRows = Object.keys(actAll).filter(k => group(k) === 'shop').sort((a, b) => actAll[b] - actAll[a]).map(k => `${esc(actName(k).replace('在店裡：', ''))} ${pct(actAll[k], sumA)}`).join('・');
  const act = `<h3>時間花在哪裡（近 90 天）</h3><p class="muted" style="margin:0 0 6px">橘色是全部玩家，綠色是玩最久的前 1/4（${heavy.size} 位）。綠色比橘色多的，就是玩很久的人特別喜歡的。</p>
    <div class="tbl"><table><thead><tr><th>在做什麼</th><th colspan="2">全部玩家</th><th colspan="2">玩最久的玩家</th></tr></thead><tbody>${actRows}</tbody></table></div>
    ${floorRows ? `<p class="muted" style="margin:6px 0 0">店裡各樓層：${floorRows}</p>` : ''}`;
  // 玩最久的玩家
  const byId = Object.fromEntries(players.map(p => [p.user_id, p]));

    return `<tr><td>${p.account ? esc(p.account) : '<span class="muted">訪客</span>'}</td><td>${esc(p.shop_name || '')}</td><td class="n">${playTime(total[u])}</td><td class="n">${l.length}</td><td>${l.length ? md(l[l.length - 1].d) : ''}</td></tr>`; }).join('');
  const top = `<h3>玩最久的玩家（近 90 天）</h3><div class="tbl"><table><thead><tr><th>帳號</th><th>店名</th><th>玩了多久</th><th>來過幾天</th><th>最後一次</th></tr></thead><tbody>${topRows}</tbody></table></div>`;
  $('statsBody').innerHTML = `<p class="muted" style="margin:0 0 10px">2026/10/31 開始記錄。只算畫面開著、兩分鐘內有操作的時間。</p>` + kpi + daily + ret + act + top;
}
